<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>Pineale Classic</title>
<style>
@font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 300 700; src: url(https://pinealeclassic.com/assets/fonts/cormorant-garamond-latin-co3bmX5slC.woff2) format('woff2'); }
@font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 300 700; src: url(https://pinealeclassic.com/assets/fonts/cormorant-garamond-latin-co3ZmX5slC.woff2) format('woff2'); }
@font-face { font-family: 'Source Serif 4'; font-style: normal; font-weight: 200 900; src: url(https://pinealeclassic.com/assets/fonts/source-serif-4-latin.woff2) format('woff2'); }
@font-face { font-family: 'Source Serif 4'; font-style: italic; font-weight: 200 900; src: url(https://pinealeclassic.com/assets/fonts/source-serif-4-italic-latin.woff2) format('woff2'); }
@font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 100 1000; src: url(https://pinealeclassic.com/assets/fonts/dm-sans-latin-rP2Yp2ywxg.woff2) format('woff2'); }
body { margin: 0; padding: 0; background: #efe8dc; -webkit-text-size-adjust: 100%; }
table { border-collapse: collapse; }

.pc-body { font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif !important; color: #3b3439 !important; }
.pc-body p { margin: 0 0 14px !important; font-size: 16px !important; line-height: 1.65 !important; color: #3b3439 !important; }
.pc-body h4 { margin: 0 0 10px !important; font-family: 'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif !important; font-size: 11px !important; font-weight: 500 !important; line-height: 1.4 !important; letter-spacing: 0.2em !important; text-transform: uppercase !important; color: #b4472f !important; }
.pc-body h4 + p { margin: 6px 0 34px !important; font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif !important; font-style: italic !important; font-size: 21px !important; line-height: 1.5 !important; color: #1a1418 !important; }
.pc-body h4 + p em, .pc-body h4 + p i { font-style: normal !important; }
.pc-body h4 + p + p { margin: -22px 0 34px !important; font-family: 'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif !important; font-style: normal !important; font-size: 11px !important; letter-spacing: 0.2em !important; text-transform: uppercase !important; text-align: right !important; color: #7f5e22 !important; }
.pc-body h1 { margin: 40px 0 28px !important; padding: 14px 0 !important; border-top: 1px solid #b08a3a !important; border-bottom: 1px solid #b08a3a !important; font-family: 'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif !important; font-size: 11px !important; font-weight: 500 !important; line-height: 1 !important; letter-spacing: 0.32em !important; text-transform: uppercase !important; text-align: center !important; color: #7f5e22 !important; }
.pc-body h2 { margin: 0 0 12px !important; font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif !important; font-size: 30px !important; font-weight: 500 !important; line-height: 1.12 !important; color: #1a1418 !important; }
.pc-body h3 { margin: 0 0 6px !important; font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif !important; font-size: 22px !important; font-weight: 500 !important; line-height: 1.2 !important; color: #1a1418 !important; }
.pc-body h2 a, .pc-body h3 a { color: #1a1418 !important; text-decoration: none !important; }
.pc-body a { color: #b4472f !important; text-decoration: none !important; }
.pc-body p a { font-family: 'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif !important; font-size: 11px !important; font-weight: 500 !important; letter-spacing: 0.2em !important; text-transform: uppercase !important; color: #b4472f !important; text-decoration: none !important; }
.pc-body img { display: block !important; width: 100% !important; max-width: 100% !important; height: auto !important; margin: 0 0 18px !important; border: 0 !important; }
.pc-body hr { margin: 30px 0 !important; border: 0 !important; border-top: 1px solid #e6dccb !important; height: 0 !important; }
.pc-body h3 + p { font-size: 14px !important; line-height: 1.55 !important; color: #6c6268 !important; margin-bottom: 10px !important; }

.pc-foot, .pc-foot p { font-family: 'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; line-height: 1.7; color: #6c6268; text-align: center; }
.pc-foot a { color: #7f5e22; text-decoration: none; }
@media (max-width: 620px) {
  .pc-pad { padding-left: 22px !important; padding-right: 22px !important; }
  .pc-body h2 { font-size: 26px !important; }
}
</style>
</head>
<body style="margin:0;padding:0;background:#efe8dc;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#efe8dc;">
<tr><td align="center" style="padding:28px 10px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#fcfaf6;border-top:3px solid #b08a3a;">
  <tr><td align="center" style="padding:18px 20px 0;">
    <a href="https://pinealeclassic.com/?utm_source=newsletter&amp;utm_medium=email&amp;utm_campaign=testata"><img src="https://pinealeclassic.com/assets/img/newsletter-testata.png" width="600" alt="Pineale Classic. Rivista di musica classica e contemporanea" style="display:block;width:100%;max-width:520px;height:auto;border:0;"></a>
  </td></tr>
  <tr><td align="center" style="padding:6px 0 0;"><div style="width:48px;height:1px;background:#b08a3a;line-height:1px;font-size:1px;">&nbsp;</div></td></tr>
  <tr><td class="pc-body pc-pad" style="padding:30px 44px 20px;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;color:#3b3439;">
{{ message_content }}
  </td></tr>
  <tr><td class="pc-foot pc-pad" style="padding:26px 44px 34px;border-top:1px solid #e6dccb;">
    <p style="margin:0 0 10px;"><a href="https://pinealeclassic.com/?utm_source=newsletter&amp;utm_medium=email&amp;utm_campaign=piede">pinealeclassic.com</a> &nbsp;·&nbsp; <a href="https://pinealeclassic.com/agenda/?utm_source=newsletter&amp;utm_medium=email&amp;utm_campaign=piede">Agenda</a> &nbsp;·&nbsp; <a href="mailto:info@pinealeclassic.com">Scrivi alla redazione</a></p>
    <p style="margin:0 0 10px;">Ricevi questa mail per la tua iscrizione alla newsletter di Pineale Classic.<br><a href="{{ unsubscribe_url }}">Cancella l'iscrizione</a></p>
    <p style="margin:0;font-size:11px;">{{ address }}</p>
  </td></tr>
</table>
</td></tr>
</table>
</body>
</html>
